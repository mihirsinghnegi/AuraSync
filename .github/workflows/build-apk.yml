name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Add Capacitor & Android Platform
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/AuraSync-v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh release-output/AuraSync-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraSync-v1.0.0-apk
          path: release-output/AuraSync-v1.0.0.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          TITLE="AuraSync v1.0.0 - Android Release"
          NOTES="### AuraSync v1.0.0 (Android APK)\n\nRestorative workspace telemetry and cadence protection companion.\n\n- **Companion Widget**: Real-time cognitive resonance dial, flow metrics, and 4-4-4 box breathing.\n- **Cadence Scheduler**: Interactive buffer protection, friction warnings, and Google/Outlook calendar sync.\n- **Focus Shield**: Non-intrusive peripheral modal with somatic reset protocols.\n- **Telemetry**: Cognitive spline analytics and ambient 432Hz acoustic shield.\n\nDownload the attached **AuraSync-v1.0.0.apk** below to install on Android."
          
          # Delete existing release/tag if already present to ensure clean upload
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" || true
          git push origin :refs/tags/"$TAG" || true

          # Create release and upload APK
          gh release create "$TAG" release-output/AuraSync-v1.0.0.apk \
            --title "$TITLE" \
            --notes "$NOTES"
