name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Add Capacitor & Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android || true
          npx cap sync android
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/AuraSync-v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh release-output/AuraSync-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraSync-v1.0.0-apk
          path: release-output/AuraSync-v1.0.0.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          TITLE="AuraSync v1.0.0 - Android Release"
          cat << 'EOF' > release-notes.md
          ### AuraSync v1.0.0 (Android APK)

          Restorative workspace telemetry and cadence protection companion.

          - **Companion Widget**: Real-time cognitive resonance dial, flow metrics, and 4-4-4 box breathing.
          - **Cadence Scheduler**: Interactive buffer protection, friction warnings, and Google/Outlook calendar sync.
          - **Focus Shield**: Non-intrusive peripheral modal with somatic reset protocols.
          - **Telemetry**: Cognitive spline analytics and ambient 432Hz acoustic shield.

          Download the attached **AuraSync-v1.0.0.apk** below to install on Android.
          EOF

          gh release delete "$TAG" --yes || true
          git push origin :refs/tags/"$TAG" || true

          gh release create "$TAG" release-output/AuraSync-v1.0.0.apk \
            --title "$TITLE" \
            --notes-file release-notes.md
